name: Publish npm analyzers
on:
  push:
    tags: ['js-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzers/javascript-typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.6.1
      - run: npm ci
      - name: Verify tag matches package version
        run: node -e 'if ("js-v" + require("./package.json").version !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - name: Verify renamed package identity
        run: node -e 'if (require("./package.json").name !== "codetestament") process.exit(1)'
      - run: npm test
      - run: npm run test:package
      - run: npm run test:architecture
      - name: Verify Python preview before publication
        run: |
          python -m unittest discover -s ../python/tests -v
          node --test ../../shared/source-facts/conformance.test.mjs ../python/tests/calibration-policy.test.mjs
          node ../python/package-smoke.mjs
      - name: Publish stable or opt-in preview
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME#js-v}" == *-* ]]; then
            npm publish --access public --tag preview
          else
            npm publish --access public --tag latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  preview-channel:
    # Also dispatchable to reconcile registry processing after an accepted upload.
    needs: publish
    if: always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Keep preview releases off latest
        working-directory: analyzers/javascript-typescript
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          test "$package" = codetestament
          [[ "$version" == *-* ]] || exit 0
          for attempt in {1..24}; do
            actual=$(npm view "$package@$version" version 2>/dev/null || true)
            if [[ "$actual" == "$version" ]]; then break; fi
            sleep 5
          done
          test "$actual" = "$version"
          tags=$(npm view "$package" dist-tags --json)
          preview=$(printf '%s' "$tags" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).preview || ""')
          latest=$(printf '%s' "$tags" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).latest || ""')
          test "$preview" = "$version"
          if [[ "$latest" == "$version" ]]; then
            node --input-type=module <<'NODE'
          const version = JSON.parse((await import('node:fs')).readFileSync('package.json', 'utf8')).version;
          const base = 'https://registry.npmjs.org/-/package/codetestament/dist-tags';
          const tags = await (await fetch(base)).json();
          if (tags.preview !== version || tags.latest !== version) throw new Error('Tags changed; refusing mutation.');
          const headers = { authorization: `Bearer ${process.env.NODE_AUTH_TOKEN}`, 'content-type': 'application/json' };
          const report = async (label, response) => {
            const body = (await response.text()).replaceAll(process.env.NODE_AUTH_TOKEN, '[REDACTED]');
            console.log(`${label}: HTTP ${response.status}; ${body.slice(0, 2000)}`);
            if (!response.ok) throw new Error(`${label} failed`);
          };
          // Reassert the identical preview value to distinguish write access from latest-tag restrictions.
          await report('Preserve existing preview tag', await fetch(`${base}/preview`, {
            method: 'PUT', headers, body: JSON.stringify(version), signal: AbortSignal.timeout(15000),
          }));
          await report('Remove latest tag', await fetch(`${base}/latest`, {
            method: 'DELETE', headers, signal: AbortSignal.timeout(15000),
          }));
          NODE
          fi
          for attempt in {1..24}; do
            tags=$(npm view "$package" dist-tags --json)
            if printf '%s' "$tags" | node -e 'const t=JSON.parse(require("fs").readFileSync(0,"utf8")); process.exit(t.preview === process.argv[1] && t.latest !== process.argv[1] ? 0 : 1)' "$version"; then
              printf '%s\n' "$tags"
              exit 0
            fi
            sleep 5
          done
          echo 'Registry channel verification did not converge.' >&2
          exit 1
